[platformio]
default_envs = esp32-3248s035r

; Perfil provisorio: confirmar o codigo da placa antes de gravar.
[env:esp32-3248s035r]
platform = platformio/espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    lovyan03/LovyanGFX@1.2.7
    bitbank2/AnimatedGIF@2.2.3
; Prioriza velocidade na compilacao do aplicativo e bibliotecas de fontes.
; Componentes precompilados do framework nao sao recompilados com esta opcao.
build_unflags = -Os
build_flags = -D LGFX_USE_V1 -O2
